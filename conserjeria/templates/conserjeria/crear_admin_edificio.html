{% extends "base.html" %}
{% block title %}Crear Administrador de Edificio{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow p-8">
    <h1 class="text-xl font-bold text-gray-800 mb-6">👤 Crear Administrador de Edificio</h1>

    <form method="post" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        {% csrf_token %}
        {% for field in form %}
            <div class="{% if field.name == 'contacto_emergencia' or field.name == 'edificio' %}sm:col-span-2{% endif %}">
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p class="text-red-600 text-xs mt-1">{{ field.errors|striptags }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <div class="sm:col-span-2 flex justify-end gap-3 mt-2">
            <a href="{% url 'conserjeria:listar_admins_edificio' %}"
               class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100">Cancelar</a>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg font-semibold">
                Guardar
            </button>
        </div>
    </form>
</div>
{% endblock %}
