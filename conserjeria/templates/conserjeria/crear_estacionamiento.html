{% extends "base.html" %}
{% block title %}Crear Estacionamiento{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-2xl shadow p-8">
    <h1 class="text-xl font-bold text-gray-800 mb-6">🚗 Crear Estacionamiento</h1>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ form.numero.label }}</label>
            {{ form.numero }}
            {% if form.numero.errors %}<p class="text-red-600 text-xs mt-1">{{ form.numero.errors|striptags }}</p>{% endif %}
        </div>
        <div class="flex justify-end gap-3">
            <a href="{% url 'conserjeria:listar_estacionamientos' %}" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100">Cancelar</a>
            <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2 rounded-lg font-semibold">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
