# Snippet de referencia -- NO se aplica solo. Hay que pegarlo dentro del
# bloque `server { ... }` existente de Nginx en el Lightsail (el mismo
# archivo donde ya está la config de proxy_pass hacia Gunicorn), ANTES del
# location genérico `location / { ... }`.
#
# Reemplaza <TU_IP> por tu IP pública fija, o por el rango de tu ISP si no
# es fija. Si administras desde varias IPs (casa + oficina), agrega una
# línea `allow` por cada una.
#
# Recuerda: esto es una capa ADICIONAL a ADMIN_URL en settings.py, no un
# reemplazo. Usa las dos.

location /admin/ {
    allow <TU_IP>;
    deny all;

    # el resto es igual al location / que ya tienes, ajusta el nombre del
    # socket/puerto de Gunicorn si es distinto en tu configuración actual
    include proxy_params;
    proxy_pass http://unix:/run/gunicorn-conserjeria.sock;
}

# Si cambiaste ADMIN_URL en el .env, actualiza también el path acá para
# que coincida (ej: location /panel-x7f2q/ { ... }).
